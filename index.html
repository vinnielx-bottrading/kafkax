<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafka X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #0B0C0B;
    --sidebar-bg: #141614;
    --panel-bg: #171917;
    --card-bg: #1C1F1C;
    --card-bg-hover: #22251F;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #F2F2EF;
    --ink-soft: #A6A69E;
    --ink-muted: #6E6E67;
    --glow: #17E88F;
    --glow-soft: rgba(23,232,143,0.35);
    --active-pill: rgba(23,232,143,0.14);
    --active-line: rgba(23,232,143,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:232px;
    background:var(--sidebar-bg);
    border-right:0.5px solid var(--line);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition: width 0.32s cubic-bezier(.4,0,.2,1), height 0.32s cubic-bezier(.4,0,.2,1), border-radius 0.32s ease, top 0.32s ease, left 0.32s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{ width:76px; }

  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 18px;
    cursor:pointer;
    flex-shrink:0;
    border-bottom:0.5px solid var(--line);
    -webkit-tap-highlight-color:transparent;
  }
  .brand-mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.03em;
    color:var(--glow);
    text-shadow: 0 0 6px var(--glow-soft), 0 0 18px var(--glow-soft), 0 0 36px rgba(23,232,143,0.2);
    animation: glowPulse 3s ease-in-out infinite;
    flex-shrink:0;
    width:26px;
    text-align:center;
  }
  .brand-full{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:16px;
    letter-spacing:0.04em;
    color:var(--ink);
    white-space:nowrap;
    opacity:1;
    transition: opacity 0.2s ease;
  }
  .sidebar.collapsed .brand-full{ opacity:0; width:0; }

  /* ---------- Holiday banner (flip Kafka X <-> festive marquee) ---------- */
  .brand-swap{
    position:relative;
    height:20px;
    flex:1;
    min-width:0;
    perspective:500px;
  }
  .sidebar.collapsed .brand-swap{ opacity:0; width:0; flex:0; }
  .brand-swap-inner{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,0,.2,1);
  }
  .brand-swap-inner.flipped{ transform:rotateX(180deg); }
  .brand-face{
    position:absolute; inset:0;
    display:flex; align-items:center;
    backface-visibility:hidden;
    overflow:hidden;
    white-space:nowrap;
  }
  .brand-face.back{ transform:rotateX(180deg); }
  .brand-holiday-text{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--glow);
    text-shadow:0 0 8px var(--glow-soft);
    padding-left:100%;
    animation:brandHolidaySlide 6s linear infinite;
  }
  @keyframes brandHolidaySlide{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }

  /* ---------- Festive light theme (chỉ bật trong khoảng ngày lễ) ---------- */
  body.holiday-light{
    --bg: #FDFBF6;
    --sidebar-bg: #FFFFFF;
    --panel-bg: #F7F3E8;
    --card-bg: #FFFFFF;
    --card-bg-hover: #FFF7E6;
    --line: rgba(20,20,15,0.10);
    --line-strong: rgba(20,20,15,0.18);
    --ink: #1A1A16;
    --ink-soft: #5B5B52;
    --ink-muted: #8A897C;
    --glow: #D4A017;
    --glow-soft: rgba(212,160,23,0.35);
    --active-pill: rgba(212,160,23,0.16);
    --active-line: rgba(212,160,23,0.45);
  }
  body.holiday-light .nav-item:hover{ background:rgba(20,20,15,0.05); }
  body.holiday-light .widget .w-icon{ background:rgba(20,20,15,0.06); }
  body.holiday-light #frameView iframe{ background:var(--bg); }
  body.holiday-light .btn-primary{ color:#3A2A00; }

  #fireworksCanvas{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:9998;
    display:none;
  }

  .holiday-plane{
    position:fixed;
    top:9%;
    left:-55%;
    display:flex;
    align-items:center;
    gap:0;
    z-index:9997;
    pointer-events:none;
    white-space:nowrap;
    opacity:0;
  }
  .holiday-plane.flying{ animation:planeFly 14s linear; }
  .holiday-plane .plane-banner{
    background:linear-gradient(90deg,#C0221D,#E13A2E);
    color:#FFD700;
    font-weight:800;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.03em;
    padding:7px 18px 7px 14px;
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
    position:relative;
    clip-path:polygon(0 50%, 12px 0, 100% 0, 100% 100%, 12px 100%);
  }
  .holiday-plane .plane-emoji{
    font-size:30px;
    margin-left:-2px;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.4));
  }
  @keyframes planeFly{
    0%{ left:-55%; opacity:0; transform:translateY(0); }
    6%{ opacity:1; }
    50%{ transform:translateY(-10px); }
    94%{ opacity:1; }
    100%{ left:108%; opacity:0; transform:translateY(0); }
  }


  @keyframes glowPulse{
    0%,100%{ text-shadow: 0 0 6px var(--glow-soft), 0 0 18px var(--glow-soft), 0 0 36px rgba(23,232,143,0.2); }
    50%{ text-shadow: 0 0 10px var(--glow-soft), 0 0 26px var(--glow-soft), 0 0 52px rgba(23,232,143,0.3); }
  }

  .nav-list{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    color:var(--ink-soft);
    border:0.5px solid transparent;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    white-space:nowrap;
    position:relative;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
  .nav-item.active{
    background:var(--active-pill);
    border-color:var(--active-line);
    color:var(--ink);
  }
  .nav-item .ic{
    width:20px; height:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-item .ic svg{ width:18px; height:18px; stroke:currentColor; }
  .nav-item .lb{
    font-size:13.5px; font-weight:500;
    opacity:1; transition:opacity 0.15s ease;
  }
  .sidebar.collapsed .nav-item .lb{ opacity:0; width:0; overflow:hidden; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding:12px; }
  .nav-item .ext-ic{ margin-left:auto; width:12px; height:12px; opacity:0.6; flex-shrink:0; }
  .sidebar.collapsed .nav-item .ext-ic{ display:none; }

  .nav-divider{
    height:0.5px;
    background:var(--line);
    margin:10px 8px;
  }

  .sidebar-foot{
    padding:12px 10px;
    border-top:0.5px solid var(--line);
    flex-shrink:0;
  }
  .toggle-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:9px;
    border-radius:9px;
    border:0.5px solid var(--line);
    background:transparent;
    color:var(--ink-muted);
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .toggle-btn:hover{ border-color:var(--line-strong); color:var(--ink-soft); }
  .toggle-btn svg{ width:14px; height:14px; stroke:currentColor; transition:transform 0.3s ease; }
  .sidebar.collapsed .toggle-btn svg{ transform:rotate(180deg); }
  .sidebar.collapsed .toggle-btn .tlb{ display:none; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    position:relative;
    overflow:hidden;
    background:var(--bg);
  }

  .progress-bar{
    position:absolute; top:0; left:0; height:2px; width:0%;
    background:var(--glow);
    box-shadow:0 0 8px var(--glow-soft);
    z-index:50;
    transition: width 0.4s ease, opacity 0.3s ease;
    opacity:0;
  }
  .progress-bar.on{ opacity:1; }

  .view{
    position:absolute; inset:0;
    opacity:1;
    transform:none;
    transition: opacity 0.6s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1);
  }
  .view.leaving{
    opacity:0;
    transform:translateX(22px);
    transition: opacity 0.22s ease, transform 0.26s ease;
    pointer-events:none;
  }
  .view.hidden{ display:none; }
  .view.pending{
    opacity:0;
    transform:translateX(22px);
    transition:none;
  }

  #frameView iframe{
    width:100%; height:100%; border:none; display:block; background:#0B0C0B;
  }

  /* ---------- Home / Widgets ---------- */
  #homeView{
    overflow-y:auto;
    padding:44px 48px;
  }
  .home-head{ margin-bottom:32px; }
  .home-head .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 8px;
  }
  .home-head h1{
    font-size:24px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .home-head p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
  }

  .widget-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:14px;
    max-width:900px;
  }

  .widget{
    aspect-ratio:1/1;
    background:var(--card-bg);
    border:0.5px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    position:relative;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    text-decoration:none;
    color:inherit;
  }
  .widget:hover{
    background:var(--card-bg-hover);
    border-color:var(--line-strong);
    transform:translateY(-2px);
  }
  .widget .w-icon{
    width:34px; height:34px;
    border-radius:9px;
    background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .widget .w-icon svg{ width:17px; height:17px; stroke:var(--ink); }
  .widget .w-label{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    word-break:break-word;
  }
  .widget .w-url{
    font-size:10.5px;
    color:var(--ink-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .widget .w-del{
    position:absolute;
    top:8px; right:8px;
    width:22px; height:22px;
    border-radius:7px;
    background:rgba(0,0,0,0.5);
    border:0.5px solid var(--line);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    z-index:2;
  }
  .widget:hover .w-del{ display:flex; }
  .widget .w-del:hover{ color:#ff6b6b; border-color:rgba(255,107,107,0.4); }
  .widget .w-del svg{ width:12px; height:12px; stroke:currentColor; }

  .widget-add{
    aspect-ratio:1/1;
    border:1px dashed var(--line-strong);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink-muted);
    background:transparent;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .widget-add:hover{ border-color:var(--glow); color:var(--glow); background:rgba(23,232,143,0.05); }
  .widget-add svg{ width:22px; height:22px; stroke:currentColor; }
  .widget-add span{ font-size:11.5px; font-weight:500; }

  /* ---------- Add widget modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width:340px;
    background:var(--panel-bg);
    border:0.5px solid var(--line);
    border-radius:16px;
    padding:24px;
  }
  .modal-box h3{ margin:0 0 18px; font-size:15px; font-weight:600; }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .modal-field input, .modal-field select{
    width:100%;
    background:var(--card-bg);
    border:0.5px solid var(--line);
    border-radius:9px;
    padding:9px 11px;
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
  }
  .modal-field input:focus, .modal-field select:focus{ outline:none; border-color:var(--active-line); }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .btn{
    flex:1;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:0.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
  }
  .btn-primary{
    background:var(--glow);
    border-color:var(--glow);
    color:#062A1B;
  }

  .home-disclaimer{
    max-width:900px;
    margin-top:40px;
    padding-top:16px;
    border-top:0.5px solid var(--line);
    font-size:10.5px;
    line-height:1.6;
    color:var(--ink-muted);
    opacity:0.7;
  }

  .sidebar-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:39;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .sidebar-backdrop.show{
    display:block;
    opacity:1;
  }

  @media (max-width:720px){
    .sidebar{ position:absolute; z-index:40; height:100%; }
    #homeView{ padding:28px 20px; }

    .sidebar.collapsed{
      width:52px;
      height:52px;
      border-radius:50%;
      position:fixed;
      top:16px;
      left:16px;
      overflow:visible;
      border:0.5px solid var(--line-strong);
      box-shadow:0 4px 20px rgba(0,0,0,0.45);
    }
    .sidebar.collapsed .nav-list,
    .sidebar.collapsed .sidebar-foot{
      display:none;
    }
    .sidebar.collapsed .brand-row{
      width:100%;
      height:100%;
      padding:0;
      border-bottom:none;
      justify-content:center;
    }
    .sidebar.collapsed .brand-mark{
      font-size:17px;
    }
  }
</style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>
<div class="holiday-plane" id="holidayPlane">
  <span class="plane-banner" id="planeBannerText"></span>
  <span class="plane-emoji">✈️</span>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="brand-row" id="brandRow" title="Về trang chủ">
    <span class="brand-mark">K</span>
    <div class="brand-swap" id="brandSwap">
      <div class="brand-swap-inner" id="brandSwapInner">
        <div class="brand-face front">
          <span class="brand-full">KAFKA X</span>
        </div>
        <div class="brand-face back">
          <span class="brand-holiday-text" id="brandHolidayText"></span>
        </div>
      </div>
    </div>
  </div>

  <nav class="nav-list" id="navList"></nav>

  <div class="sidebar-foot">
    <button class="toggle-btn" id="toggleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="tlb">Thu gọn</span>
    </button>
  </div>
</aside>

<main class="main">
  <div class="progress-bar" id="progressBar"></div>

  <div class="view" id="homeView">
    <div class="home-head">
      <p class="eyebrow">Kafka X · Marketing Matrix</p>
      <h1>Kênh theo dõi</h1>
      <p>Truy cập nhanh các kênh social đang quản lý — tự thêm hoặc xóa tùy ý.</p>
    </div>
    <div class="widget-grid" id="widgetGrid"></div>
    <p class="home-disclaimer">Dự án sử dụng mã nguồn thuộc quyền sở hữu của Liên Minh Codebase Coolify của các tác giả Fency, Nemoo, ChuHeoCanDam, Amoralic, VelvetBlue.</p>
  </div>

  <div class="view hidden" id="frameView">
    <iframe id="mainFrame" title="Kafka X content"></iframe>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Thêm kênh theo dõi</h3>
    <div class="modal-field">
      <label>Nền tảng</label>
      <select id="wPlatform">
        <option value="facebook">Facebook</option>
        <option value="tiktok">TikTok</option>
        <option value="instagram">Instagram</option>
        <option value="youtube">YouTube</option>
        <option value="zalo">Zalo</option>
        <option value="website">Website / Khác</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Tên kênh</label>
      <input type="text" id="wLabel" placeholder="VD: VPS Global Travel">
    </div>
    <div class="modal-field">
      <label>Đường dẫn</label>
      <input type="text" id="wUrl" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn" id="wCancel">Hủy</button>
      <button class="btn btn-primary" id="wSave">Thêm</button>
    </div>
  </div>
</div>

<script>
(function(){

  /* ======================================================================
     CẤU HÌNH BANNER LỄ (logo Kafka X đổi thành chữ chúc mừng theo dịp lễ)
     ------------------------------------------------------------------
     Muốn đổi dịp lễ khác, chỉ cần sửa các dòng bên dưới, không cần đụng
     gì thêm ở chỗ khác trong file này:

       enabled       : true/false — bật/tắt toàn bộ hiệu ứng lễ (banner,
                       theme sáng, pháo hoa, máy bay)
       text          : chữ chạy ngang trên logo sidebar
       startDate     : ngày bắt đầu hiện hiệu ứng, định dạng 'YYYY-MM-DD'
       endDate       : ngày cuối cùng còn hiện hiệu ứng, định dạng 'YYYY-MM-DD'
       peakDate      : ngày lễ chính thức — pháo hoa sẽ bắn DÀY NHẤT vào
                       đúng ngày này, thưa dần về phía 2 đầu startDate/endDate
       flipEveryMs   : tốc độ lật logo (mili-giây)
       planeText     : chữ trên banner máy bay kéo qua màn hình
       planeEveryMs  : bao lâu máy bay bay qua 1 lần (mili-giây)
       fireworks.minIntervalMs : giãn cách bắn pháo hoa xa ngày lễ nhất
       fireworks.maxIntervalMs : giãn cách bắn pháo hoa ĐÚNG ngày lễ (nhanh nhất)
       fireworks.barrageChance : xác suất (0–1) mỗi đợt bắn thành 1 loạt dày đặc

     Ví dụ đổi sang Tết Nguyên Đán:
       text: 'CHÚC MỪNG NĂM MỚI 🧧',
       startDate: '2027-02-10', peakDate: '2027-02-17', endDate: '2027-02-20',
       planeText: 'CHÚC MỪNG NĂM MỚI ĐINH MÙI 2027',
     ====================================================================== */
  var HOLIDAY_BANNER = {
    enabled: false,
    text: '🎉 CHÚC MỪNG QUỐC KHÁNH 2-9 🎉',
    startDate: '2026-08-28',
    peakDate: '2026-09-02',
    endDate: '2026-09-03',
    flipEveryMs: 2000,
    planeText: 'CHÚC MỪNG NGÀY QUỐC KHÁNH VIỆT NAM 2/9',
    planeEveryMs: 28000,
    fireworks: {
      minIntervalMs: 1600,
      maxIntervalMs: 260,
      barrageChance: 0.22
    }
  };

  var NAV = [
    { id:'content-planner', label:'Content Planner', url:'https://contentplanner-ten.vercel.app/', icon:'clipboard' },
    { id:'du-an', label:'Dự án', url:'https://amoralicproject.vercel.app/', icon:'rocket' },

  function navigateFrame(url){

      frameView.classList.remove('hidden', 'leaving');
      frameView.classList.add('pending');
      progressBar.style.width = '55%';

      mainFrame.src = url;

      var revealed = false;
      function reveal(){
        if(revealed) return;
        revealed = true;
        progressBar.style.width = '100%';
        // Cho trình duyệt 1 nhịp để trang bên trong kịp vẽ xong trước khi bắt đầu trượt vào,
        // tránh cảm giác "bật ra" ngay khi vừa tải xong.
        setTimeout(function(){
          frameView.classList.remove('pending');
          setTimeout(function(){
            progressBar.classList.remove('on');
            progressBar.style.width = '0%';
          }, 400);
        }, 160);
      }

      mainFrame.onload = reveal;
      // Dự phòng: nếu trang trong iframe tải quá lâu hoặc sự kiện load không bắn ra được,
      // vẫn hiện ra sau tối đa 3.5 giây để không bị kẹt màn hình trống.
      setTimeout(reveal, 3500);

  /* ---------- Kiểm tra có đang trong khoảng ngày lễ không (dùng chung cho banner + theme sáng + pháo hoa) ---------- */
  function isHolidayPeriodActive(){
    if(!HOLIDAY_BANNER.enabled) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    var start = new Date(HOLIDAY_BANNER.startDate + 'T00:00:00');
    var end = new Date(HOLIDAY_BANNER.endDate + 'T23:59:59');
    return !(today < start || today > end);
  }

  (function initHolidayBanner(){
    if(!isHolidayPeriodActive()) return; // ngoài khoảng ngày -> chỉ hiện "KAFKA X" như bình thường

    var textEl = document.getElementById('brandHolidayText');

  /* Độ gần ngày lễ chính (0 = ở rìa startDate/endDate, 1 = đúng ngày peakDate) */
  function holidayProximity(){
    var today = new Date(); today.setHours(0,0,0,0);
    var start = new Date(HOLIDAY_BANNER.startDate + 'T00:00:00');
    var end = new Date(HOLIDAY_BANNER.endDate + 'T00:00:00');
    var peak = new Date(HOLIDAY_BANNER.peakDate + 'T00:00:00');
    var msPerDay = 86400000;
    var dist = Math.abs(today - peak) / msPerDay;
    var span = today <= peak
      ? Math.max((peak - start) / msPerDay, 1)
      : Math.max((end - peak) / msPerDay, 1);
    var t = 1 - Math.min(dist / span, 1);
    return Math.max(0, Math.min(1, t));
  }

  function startFireworks(){
    var canvas = document.getElementById('fireworksCanvas');
    if(!canvas || !canvas.getContext) return;
    canvas.style.display = 'block';
    var ctx = canvas.getContext('2d');

    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    var particles = []; // gồm cả rocket (đang bay lên) và spark (mảnh vỡ sau khi nổ)
    var COLOR_SETS = [
      ['#FFD700', '#FFB347'],           // vàng gold
      ['#FF4B4B', '#FF9E7A'],           // đỏ
      ['#FFFFFF', '#CFE8FF'],           // trắng bạc
      ['#4FD1FF', '#7FE3FF'],           // xanh dương
      ['#B983FF', '#E4C7FF'],           // tím
      ['#FF6FD8', '#FFC2EE'],           // hồng
      ['#4BFFA5', '#B6FFDB']            // xanh lá non
    ];
    var SHAPES = ['circle', 'star', 'square'];

    function drawShape(shape, x, y, size, color, alpha){
      ctx.globalAlpha = Math.max(alpha, 0);
      ctx.fillStyle = color;
      if(shape === 'circle'){
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      } else if(shape === 'square'){
        ctx.fillRect(x - size, y - size, size * 2, size * 2);
      } else if(shape === 'star'){
        ctx.beginPath();
        for(var i = 0; i < 4; i++){
          var a = (Math.PI / 2) * i;
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(a) * size * 2, y + Math.sin(a) * size * 2);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(size * 0.6, 1);
        ctx.stroke();
      }
    }

    function explode(x, y){
      var palette = COLOR_SETS[Math.floor(Math.random() * COLOR_SETS.length)];
      var shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      var pattern = Math.random();
      var count, speedBase, gravity, fade, sizeBase;
      if(pattern < 0.33){ // chrysanthemum - dày, tàn chậm
        count = 55 + Math.floor(Math.random() * 35);
        speedBase = 2 + Math.random() * 2.5;
        gravity = 0.035; fade = 0.009; sizeBase = 1.6;
      } else if(pattern < 0.66){ // ring - vòng tròn đều
        count = 40 + Math.floor(Math.random() * 10);
        speedBase = 3.5 + Math.random() * 1;
        gravity = 0.05; fade = 0.014; sizeBase = 1.8;
      } else { // peony - gọn, nhanh tàn
        count = 26 + Math.floor(Math.random() * 20);
        speedBase = 2.5 + Math.random() * 3;
        gravity = 0.05; fade = 0.016; sizeBase = 2.1;
      }
      for(var i = 0; i < count; i++){
        var angle = (Math.PI * 2 * i) / count + Math.random() * 0.25;
        var speed = speedBase + Math.random() * 1.5;
        particles.push({
          type:'spark',
          x:x, y:y,
          vx:Math.cos(angle) * speed,
          vy:Math.sin(angle) * speed,
          alpha:1,
          fade:fade,
          gravity:gravity,
          color: Math.random() < 0.7 ? palette[0] : palette[1],
          size: sizeBase + Math.random() * 1.4,
          shape: shape
        });
      }
    }

    function spawnRocket(){
      var x = canvas.width * (0.08 + Math.random() * 0.84);
      var targetY = canvas.height * (0.12 + Math.random() * 0.4);
      var palette = COLOR_SETS[Math.floor(Math.random() * COLOR_SETS.length)];
      particles.push({
        type:'rocket',
        x:x, y:canvas.height + 10,
        vx:(Math.random() - 0.5) * 0.8,
        vy:-(7 + Math.random() * 3),
        targetY:targetY,
        color:palette[0],
        trail:[]
      });
    }

    function spawnBarrage(){
      var n = 4 + Math.floor(Math.random() * 5);
      for(var i = 0; i < n; i++){
        setTimeout(spawnRocket, i * (90 + Math.random() * 120));
      }
    }

    function scheduleNext(){
      var proximity = holidayProximity(); // 0..1, càng gần peakDate càng lớn
      var cfg = HOLIDAY_BANNER.fireworks || {};
      var minMs = cfg.minIntervalMs || 1600;
      var maxMs = cfg.maxIntervalMs || 260;
      var interval = minMs - (minMs - maxMs) * proximity;
      var barrageChance = (cfg.barrageChance || 0.2) * (0.5 + proximity);

      if(Math.random() < barrageChance){
        spawnBarrage();
      } else {
        spawnRocket();
      }
      setTimeout(scheduleNext, interval * (0.6 + Math.random() * 0.8));
    }
    setTimeout(scheduleNext, 300);

    function tick(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for(var i = particles.length - 1; i >= 0; i--){
        var p = particles[i];
        if(p.type === 'rocket'){
          p.trail.push({x:p.x, y:p.y});
          if(p.trail.length > 6) p.trail.shift();
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.02; // giảm tốc dần khi bay lên
          for(var t = 0; t < p.trail.length; t++){
            var tp = p.trail[t];
            ctx.globalAlpha = (t + 1) / p.trail.length * 0.6;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
          if(p.y <= p.targetY || p.vy >= -0.5){
            explode(p.x, p.y);
            particles.splice(i, 1);
          }
          continue;
        }
        // spark
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.99;
        p.alpha -= p.fade;
        if(p.alpha <= 0){ particles.splice(i, 1); continue; }
        drawShape(p.shape, p.x, p.y, p.size, p.color, p.alpha);
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
