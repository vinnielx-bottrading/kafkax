<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafka X · Content Planner</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1><span class="dot"></span> <span class="kafkax-brand">KAFKA X</span></h1>
  <button type="button" id="authAreaBtn" class="auth-login-btn">🔓 Đăng nhập</button>
  <div class="toolbar">
    <span class="sync-status" id="syncStatus" title="Trạng thái đồng bộ Supabase">⚪ Đang kết nối...</span>
  </div>
</header>

<main>
  <section id="plannerSection">
    <div class="sub-toolbar toolbar-main-row">
      <input type="text" id="searchBox" class="toolbar-search-input" placeholder="Tìm nội dung...">
      <button type="button" class="btn-ghost" id="toggleFiltersBtn">🔍 Bộ lọc &amp; Xuất/Nhập ▾</button>
      <button class="btn-primary" id="addBtn">+ Thêm Content</button>
    </div>
    <div class="sub-toolbar toolbar-filters-row hidden-section" id="filtersPanel">
      <select id="filterMonth"><option value="">Tất cả tháng</option></select>
      <select id="filterStatus"><option value="">Tất cả Trạng thái</option></select>
      <select id="filterBrand"><option value="">Tất cả Thương hiệu</option></select>
      <select id="filterPillar"><option value="">Tất cả Pillar</option></select>
      <select id="filterChannel"><option value="">Tất cả Kênh</option></select>
      <button class="btn-ghost" id="exportBtn">⬇ Export JSON</button>
      <button class="btn-ghost" id="importBtn">⬆ Import JSON</button>
      <input type="file" id="importFile" accept="application/json">
      <button type="button" class="btn-ghost" id="migrateThumbsBtn" style="display:none;" title="Chuyển các ảnh thumbnail đang dán trực tiếp dạng base64 trong database sang Supabase Storage, giúp giảm dung lượng và tăng tốc đồng bộ. Chỉ admin nhìn thấy nút này.">🧹 Dọn ảnh nặng</button>
    </div>
    <div class="grid-count" id="gridCount"></div>
    <div id="board"></div>
  </section>

</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button type="button" class="modal-close-x" id="modalCloseX" title="Đóng">✕</button>
    <h2 id="modalTitle">Thêm content mới</h2>
    <form id="cardForm">
      <input type="hidden" id="cardId">
      <div class="row2">
        <div class="field">
          <label>Tuần</label>
          <select id="fWeek"></select>
        </div>
        <div class="field">
          <label>Ngày đăng</label>
          <input type="text" id="fDate" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10">
        </div>
      </div>
      <div class="field" id="fContentWrap" style="display:none">
        <textarea id="fContent" placeholder="Tiêu đề / mô tả nội dung"></textarea>
      </div>
      <div class="field" id="fBlogWrap">
        <label>Nội dung</label>
        <div class="blog-toolbar">
          <button type="button" class="blog-tb-btn" data-cmd="bold" title="In đậm"><b>B</b></button>
          <button type="button" class="blog-tb-btn" data-cmd="italic" title="In nghiêng"><i>I</i></button>
          <button type="button" class="blog-tb-btn" data-block="H2" title="Tiêu đề">H2</button>
          <button type="button" class="blog-tb-btn" data-block="H3" title="Tiêu đề nhỏ">H3</button>
          <button type="button" class="blog-tb-btn" data-cmd="insertUnorderedList" title="Danh sách">• List</button>
          <button type="button" class="blog-tb-btn" data-block="P" title="Đoạn văn thường">¶</button>
          <button type="button" class="blog-tb-btn" id="fBlogImgBtn" title="Chèn ảnh vào bài">🖼 Ảnh</button>
          <input type="file" id="fBlogImgFile" accept="image/*" style="display:none;">
          <span class="blog-tb-hint">Có thể dán ảnh trực tiếp (Ctrl+V) vào khung bên dưới</span>
        </div>
        <div id="fBody" class="blog-editor" contenteditable="true" data-placeholder="Nhập nội dung ở đây — ngắn hay dài đều dùng chung khung này, có thể chèn nhiều ảnh xen kẽ trong bài."></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Thương hiệu</label>
          <select id="fBrand"></select>
        </div>
        <div class="field">
          <label>Định dạng nội dung</label>
          <select id="fFormat"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Pillar</label>
          <select id="fPillar"></select>
        </div>
        <div class="field">
          <label>Trạng thái</label>
          <select id="fStatus"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Sản phẩm</label>
          <select id="fProduct"></select>
        </div>
        <div class="field">
          <label>CTA</label>
          <input type="text" id="fCta" placeholder="VD: Inbox tư vấn">
        </div>
      </div>
      <div class="field">
        <label>Kênh đăng</label>
        <div class="channel-checks" id="channelChecks"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Người phụ trách</label>
          <input type="text" id="fAssignee" placeholder="VD: Trường">
        </div>
        <div class="field">
          <label style="display:none">Deadline</label>
          <input type="text" id="fDeadline" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" style="display:none">
        </div>
      </div>
      <div class="field">
        <label>Link bài đăng</label>
        <input type="url" id="fLink" placeholder="https://...">
      </div>
      <div class="field">
        <label>Ảnh thumbnail</label>
        <div class="thumb-upload-row">
          <input type="url" id="fThumb" placeholder="https://... (hoặc tải ảnh lên)">
          <button type="button" class="btn-ghost" id="fThumbUploadBtn">⬆ Tải ảnh lên</button>
          <input type="file" id="fThumbFile" accept="image/*" style="display:none;">
        </div>
        <img id="fThumbPreview" class="thumb-upload-preview" alt="Xem trước ảnh thumbnail">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteBtn">Xóa</button>
        <div class="right">
          <button type="button" class="btn-ghost" id="cancelBtn">Hủy</button>
          <button type="submit" class="btn-primary">Lưu</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="authOverlay">
  <div class="modal auth-modal">
    <button type="button" class="modal-close-x" id="authModalCloseX" title="Đóng">✕</button>
    <h2>🔐 Đăng nhập</h2>
    <form id="authForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="authEmail" required autocomplete="username" placeholder="ban@vpsglobal.com">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="authPassword" required autocomplete="current-password">
      </div>
      <div id="authError" class="auth-error"></div>
      <div class="modal-actions">
        <div class="right">
          <button type="button" class="btn-ghost" id="authCancelBtn">Hủy</button>
          <button type="submit" class="btn-primary" id="authSubmitBtn">Đăng nhập</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="modal" id="viewModal">
    <button type="button" class="modal-close-x" id="viewModalCloseX" title="Đóng">✕</button>
    <div id="viewBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="viewDeleteBtn">Xóa</button>
      <div class="right">
        <button type="button" class="btn-ghost" id="viewCloseBtn">Đóng</button>
        <button type="button" class="btn-ghost" id="viewReviewBtn">📤 Cần xem xét</button>
        <button type="button" class="btn-danger" id="viewRequestChangesBtn">✏ Yêu cầu chỉnh sửa</button>
        <button type="button" class="btn-approve" id="viewApproveBtn">✅ Phê duyệt</button>
        <button type="button" class="btn-primary" id="viewEditBtn">✏ Chỉnh sửa</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/app-core.js"></script>


<script src="js/card-content-truncate.js"></script>

<script src="js/thumbnail-upload.js"></script>

<script src="js/week-colors.js"></script>

<script src="js/sort-by-day.js"></script>

<script src="js/remove-view-post-links.js"></script>

<script src="js/editor-toolbar.js"></script>


<div id="toastStack" aria-live="polite"></div>

<script src="js/update-notifications.js"></script>



<script src="js/require-date-autoweek.js"></script>



<script src="js/auth.js"></script>

<script src="js/migrate-thumbs.js"></script>

</body>
</html>
