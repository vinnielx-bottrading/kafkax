<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafka X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0B;
    --sidebar-bg: #141614;
    --panel-bg: #171917;
    --card-bg: #1C1F1C;
    --card-bg-hover: #22251F;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #F2F2EF;
    --ink-soft: #A6A69E;
    --ink-muted: #6E6E67;
    --glow: #17E88F;
    --glow-soft: rgba(23,232,143,0.35);
    --active-pill: rgba(23,232,143,0.14);
    --active-line: rgba(23,232,143,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:232px;
    background:var(--sidebar-bg);
    border-right:0.5px solid var(--line);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition: width 0.32s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .sidebar.collapsed{ width:76px; }

  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 18px;
    cursor:pointer;
    flex-shrink:0;
    border-bottom:0.5px solid var(--line);
    -webkit-tap-highlight-color:transparent;
  }
  .brand-mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.03em;
    color:var(--glow);
    text-shadow: 0 0 6px var(--glow-soft), 0 0 18px var(--glow-soft), 0 0 36px rgba(23,232,143,0.2);
    animation: glowPulse 3s ease-in-out infinite;
    flex-shrink:0;
    width:26px;
    text-align:center;
  }
  .brand-full{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:16px;
    letter-spacing:0.04em;
    color:var(--ink);
    white-space:nowrap;
    opacity:1;
    transition: opacity 0.2s ease;
  }
  .sidebar.collapsed .brand-full{ opacity:0; width:0; }

  @keyframes glowPulse{
    0%,100%{ text-shadow: 0 0 6px var(--glow-soft), 0 0 18px var(--glow-soft), 0 0 36px rgba(23,232,143,0.2); }
    50%{ text-shadow: 0 0 10px var(--glow-soft), 0 0 26px var(--glow-soft), 0 0 52px rgba(23,232,143,0.3); }
  }

  .nav-list{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    color:var(--ink-soft);
    border:0.5px solid transparent;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    white-space:nowrap;
    position:relative;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
  .nav-item.active{
    background:var(--active-pill);
    border-color:var(--active-line);
    color:var(--ink);
  }
  .nav-item .ic{
    width:20px; height:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-item .ic svg{ width:18px; height:18px; stroke:currentColor; }
  .nav-item .lb{
    font-size:13.5px; font-weight:500;
    opacity:1; transition:opacity 0.15s ease;
  }
  .sidebar.collapsed .nav-item .lb{ opacity:0; width:0; overflow:hidden; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding:12px; }
  .nav-item .ext-ic{ margin-left:auto; width:12px; height:12px; opacity:0.6; flex-shrink:0; }
  .sidebar.collapsed .nav-item .ext-ic{ display:none; }

  .nav-divider{
    height:0.5px;
    background:var(--line);
    margin:10px 8px;
  }

  .sidebar-foot{
    padding:12px 10px;
    border-top:0.5px solid var(--line);
    flex-shrink:0;
  }
  .toggle-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:9px;
    border-radius:9px;
    border:0.5px solid var(--line);
    background:transparent;
    color:var(--ink-muted);
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .toggle-btn:hover{ border-color:var(--line-strong); color:var(--ink-soft); }
  .toggle-btn svg{ width:14px; height:14px; stroke:currentColor; transition:transform 0.3s ease; }
  .sidebar.collapsed .toggle-btn svg{ transform:rotate(180deg); }
  .sidebar.collapsed .toggle-btn .tlb{ display:none; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    position:relative;
    overflow:hidden;
    background:var(--bg);
  }

  .progress-bar{
    position:absolute; top:0; left:0; height:2px; width:0%;
    background:var(--glow);
    box-shadow:0 0 8px var(--glow-soft);
    z-index:50;
    transition: width 0.4s ease, opacity 0.3s ease;
    opacity:0;
  }
  .progress-bar.on{ opacity:1; }

  .view{
    position:absolute; inset:0;
    opacity:1;
    transform:none;
    transition: opacity 0.6s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1);
  }
  .view.leaving{
    opacity:0;
    transform:translateX(22px);
    transition: opacity 0.22s ease, transform 0.26s ease;
    pointer-events:none;
  }
  .view.hidden{ display:none; }
  .view.pending{
    opacity:0;
    transform:translateX(22px);
    transition:none;
  }

  #frameView iframe{
    width:100%; height:100%; border:none; display:block; background:#0B0C0B;
  }

  /* ---------- Home / Widgets ---------- */
  #homeView{
    overflow-y:auto;
    padding:44px 48px;
  }
  .home-head{ margin-bottom:32px; }
  .home-head .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 8px;
  }
  .home-head h1{
    font-size:24px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .home-head p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
  }

  .widget-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:14px;
    max-width:900px;
  }

  .widget{
    aspect-ratio:1/1;
    background:var(--card-bg);
    border:0.5px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    position:relative;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    text-decoration:none;
    color:inherit;
  }
  .widget:hover{
    background:var(--card-bg-hover);
    border-color:var(--line-strong);
    transform:translateY(-2px);
  }
  .widget .w-icon{
    width:34px; height:34px;
    border-radius:9px;
    background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .widget .w-icon svg{ width:17px; height:17px; stroke:var(--ink); }
  .widget .w-label{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    word-break:break-word;
  }
  .widget .w-url{
    font-size:10.5px;
    color:var(--ink-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .widget .w-del{
    position:absolute;
    top:8px; right:8px;
    width:22px; height:22px;
    border-radius:7px;
    background:rgba(0,0,0,0.5);
    border:0.5px solid var(--line);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    z-index:2;
  }
  .widget:hover .w-del{ display:flex; }
  .widget .w-del:hover{ color:#ff6b6b; border-color:rgba(255,107,107,0.4); }
  .widget .w-del svg{ width:12px; height:12px; stroke:currentColor; }

  .widget-add{
    aspect-ratio:1/1;
    border:1px dashed var(--line-strong);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink-muted);
    background:transparent;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .widget-add:hover{ border-color:var(--glow); color:var(--glow); background:rgba(23,232,143,0.05); }
  .widget-add svg{ width:22px; height:22px; stroke:currentColor; }
  .widget-add span{ font-size:11.5px; font-weight:500; }

  /* ---------- Add widget modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width:340px;
    background:var(--panel-bg);
    border:0.5px solid var(--line);
    border-radius:16px;
    padding:24px;
  }
  .modal-box h3{ margin:0 0 18px; font-size:15px; font-weight:600; }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .modal-field input, .modal-field select{
    width:100%;
    background:var(--card-bg);
    border:0.5px solid var(--line);
    border-radius:9px;
    padding:9px 11px;
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
  }
  .modal-field input:focus, .modal-field select:focus{ outline:none; border-color:var(--active-line); }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .btn{
    flex:1;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:0.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
  }
  .btn-primary{
    background:var(--glow);
    border-color:var(--glow);
    color:#062A1B;
  }

  .home-disclaimer{
    max-width:900px;
    margin-top:40px;
    padding-top:16px;
    border-top:0.5px solid var(--line);
    font-size:10.5px;
    line-height:1.6;
    color:var(--ink-muted);
    opacity:0.7;
  }

  @media (max-width:720px){
    .sidebar{ position:absolute; z-index:40; height:100%; }
    #homeView{ padding:28px 20px; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand-row" id="brandRow" title="Về trang chủ">
    <span class="brand-mark">K</span>
    <span class="brand-full">KAFKA X</span>
  </div>

  <nav class="nav-list" id="navList"></nav>

  <div class="sidebar-foot">
    <button class="toggle-btn" id="toggleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="tlb">Thu gọn</span>
    </button>
  </div>
</aside>

<main class="main">
  <div class="progress-bar" id="progressBar"></div>

  <div class="view" id="homeView">
    <div class="home-head">
      <p class="eyebrow">Kafka X · Marketing Matrix</p>
      <h1>Kênh theo dõi</h1>
      <p>Truy cập nhanh các kênh social đang quản lý — tự thêm hoặc xóa tùy ý.</p>
    </div>
    <div class="widget-grid" id="widgetGrid"></div>
    <p class="home-disclaimer">Dự án sử dụng mã nguồn thuộc quyền sở hữu của Liên Minh Codebase Coolify của các tác giả Fency, Nemoo, ChuHeoCanDam, Amoralic, VelvetBlue.</p>
  </div>

  <div class="view hidden" id="frameView">
    <iframe id="mainFrame" title="Kafka X content"></iframe>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Thêm kênh theo dõi</h3>
    <div class="modal-field">
      <label>Nền tảng</label>
      <select id="wPlatform">
        <option value="facebook">Facebook</option>
        <option value="tiktok">TikTok</option>
        <option value="instagram">Instagram</option>
        <option value="youtube">YouTube</option>
        <option value="zalo">Zalo</option>
        <option value="website">Website / Khác</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Tên kênh</label>
      <input type="text" id="wLabel" placeholder="VD: VPS Global Travel">
    </div>
    <div class="modal-field">
      <label>Đường dẫn</label>
      <input type="text" id="wUrl" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn" id="wCancel">Hủy</button>
      <button class="btn btn-primary" id="wSave">Thêm</button>
    </div>
  </div>
</div>

<script>
(function(){

  var NAV = [
    { id:'content-planner', label:'Content Planner', url:'https://contentplanner-ten.vercel.app/', icon:'clipboard' },
    { id:'du-an', label:'Dự án', url:'https://amoralicproject.vercel.app/', icon:'rocket' },
    { id:'digital-performance', label:'Digital Performance', url:'https://digitalhub-one.vercel.app/', icon:'monitor' },
    { id:'event-layout', label:'Event Layout', url:'https://eventlayout.vercel.app/', icon:'layers' },
    { id:'trade-marketing', label:'Trade Marketing', url:'https://trademarketing-eight.vercel.app/', icon:'flag' },
    { id:'cong-viec-nhom', label:'Công việc nhóm', url:'https://congviecnhom.vercel.app/', icon:'check' },
    { id:'ghi-chu', label:'Ghi chú', url:'https://notes-freeform.vercel.app/', icon:'notes' }
  ];

  var ICONS = {
    clipboard: '<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 12h6M9 16h4"/>',
    check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V15"/>',
    layers: '<path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/><path d="M8 2v16M16 6v16"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    notes: '<path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M15 3v6h6M9 13h6M9 17h6"/>',
    rocket: '<path d="M12 2c2.5 2.5 4 6 4 10 0 2-1 4-2 5l-2 2-2-2c-1-1-2-3-2-5 0-4 1.5-7.5 4-10z"/><circle cx="12" cy="9" r="1.6"/><path d="M9 16l-3 5 4-1M15 16l3 5-4-1"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.5l.5-4H14V7a1 1 0 0 1 1-1h3z"/>',
    tiktok: '<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/>',
    youtube: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l6 3-6 3z" fill="currentColor" stroke="none"/>',
    zalo: '<circle cx="12" cy="12" r="9"/><path d="M9 9h4l-4 6h4"/>',
    website: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 14.3 0 18M12 3c-2.5 2.7-2.5 14.3 0 18"/>'
  };

  function svgIcon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.website)+'</svg>';
  }

  var navList = document.getElementById('navList');
  var sidebar = document.getElementById('sidebar');
  var frameView = document.getElementById('frameView');
  var homeView = document.getElementById('homeView');
  var mainFrame = document.getElementById('mainFrame');
  var progressBar = document.getElementById('progressBar');
  var activeId = null;

  NAV.forEach(function(item, idx){
    var el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.id = item.id;
    el.innerHTML =
      '<span class="ic">'+svgIcon(item.icon)+'</span>' +
      '<span class="lb">'+item.label+'</span>' +
      (item.external ? '<span class="ext-ic">'+svgIcon('external')+'</span>' : '');
    if(idx === NAV.length - 1){
      var div = document.createElement('div');
      div.className = 'nav-divider';
      navList.appendChild(div);
    }
    el.addEventListener('click', function(){ selectNav(item, el); });
    navList.appendChild(el);
  });

  function setActiveClass(id){
    document.querySelectorAll('.nav-item').forEach(function(n){
      n.classList.toggle('active', n.dataset.id === id);
    });
  }

  function selectNav(item, el){
    if(item.external){
      window.open(item.url, '_blank', 'noopener');
      return;
    }
    activeId = item.id;
    setActiveClass(item.id);
    collapseSidebar();
    navigateFrame(item.url);
  }

  function navigateFrame(url){
    progressBar.classList.add('on');
    progressBar.style.width = '25%';

    homeView.classList.add('leaving');

    setTimeout(function(){
      homeView.classList.add('hidden');

      // Đặt khung mới ở trạng thái "pending" (vô hình, chưa trượt vào) trong lúc trang thật đang tải bên trong iframe
      frameView.classList.remove('hidden', 'leaving');
      frameView.classList.add('pending');
      progressBar.style.width = '55%';

      mainFrame.src = url;

      var revealed = false;
      function reveal(){
        if(revealed) return;
        revealed = true;
        progressBar.style.width = '100%';
        // Cho trình duyệt 1 nhịp để trang bên trong kịp vẽ xong trước khi bắt đầu trượt vào,
        // tránh cảm giác "bật ra" ngay khi vừa tải xong.
        setTimeout(function(){
          frameView.classList.remove('pending');
          setTimeout(function(){
            progressBar.classList.remove('on');
            progressBar.style.width = '0%';
          }, 400);
        }, 160);
      }

      mainFrame.onload = reveal;
      // Dự phòng: nếu trang trong iframe tải quá lâu hoặc sự kiện load không bắn ra được,
      // vẫn hiện ra sau tối đa 3.5 giây để không bị kẹt màn hình trống.
      setTimeout(reveal, 3500);
    }, 220);
  }

  function goHome(){
    activeId = null;
    setActiveClass(null);
    expandSidebar();

    frameView.classList.add('leaving');
    frameView.classList.remove('pending');
    setTimeout(function(){
      frameView.classList.add('hidden');
      mainFrame.src = 'about:blank';
      homeView.classList.remove('hidden');
      homeView.classList.add('pending');
      requestAnimationFrame(function(){
        homeView.classList.remove('leaving');
        setTimeout(function(){ homeView.classList.remove('pending'); }, 30);
      });
    }, 220);
  }

  document.getElementById('brandRow').addEventListener('click', goHome);

  function collapseSidebar(){ sidebar.classList.add('collapsed'); }
  function expandSidebar(){ sidebar.classList.remove('collapsed'); }
  document.getElementById('toggleBtn').addEventListener('click', function(){
    sidebar.classList.toggle('collapsed');
  });

  // ---------------- Widgets ----------------
  var STORAGE_KEY = 'kafkaXSocialWidgets';
  var widgetGrid = document.getElementById('widgetGrid');
  var modalOverlay = document.getElementById('modalOverlay');

  function loadWidgets(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return [
      { platform:'facebook', label:'VPS Global Travel', url:'https://facebook.com/vpsglobal.travel' },
      { platform:'tiktok', label:'VPS Global Travel', url:'https://tiktok.com/@vpsglobal.travel' }
    ];
  }
  function saveWidgets(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  }

  var widgets = loadWidgets();

  function renderWidgets(){
    widgetGrid.innerHTML = '';
    widgets.forEach(function(w, idx){
      var a = document.createElement('a');
      a.className = 'widget';
      a.href = w.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<div class="w-del" data-idx="'+idx+'">'+svgIcon('external').replace('external','')+'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>' +
        '<div class="w-icon">'+svgIcon(w.platform)+'</div>' +
        '<div><div class="w-label">'+escapeHtml(w.label)+'</div><div class="w-url">'+escapeHtml(w.url.replace(/^https?:\/\//,''))+'</div></div>';
      var delBtn = a.querySelector('.w-del');
      delBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        widgets.splice(idx, 1);
        saveWidgets(widgets);
        renderWidgets();
      });
      widgetGrid.appendChild(a);
    });

    var addTile = document.createElement('div');
    addTile.className = 'widget-add';
    addTile.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Thêm kênh</span>';
    addTile.addEventListener('click', openModal);
    widgetGrid.appendChild(addTile);
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function openModal(){
    document.getElementById('wLabel').value = '';
    document.getElementById('wUrl').value = '';
    document.getElementById('wPlatform').value = 'facebook';
    modalOverlay.classList.add('open');
  }
  function closeModal(){ modalOverlay.classList.remove('open'); }

  document.getElementById('wCancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeModal(); });

  document.getElementById('wSave').addEventListener('click', function(){
    var label = document.getElementById('wLabel').value.trim();
    var url = document.getElementById('wUrl').value.trim();
    var platform = document.getElementById('wPlatform').value;
    if(!label || !url){ alert('Nhập đầy đủ tên kênh và đường dẫn nhé.'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    widgets.push({ platform:platform, label:label, url:url });
    saveWidgets(widgets);
    renderWidgets();
    closeModal();
  });

  renderWidgets();

})();
</script>

</body>
</html>
